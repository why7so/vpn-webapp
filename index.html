<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Личный кабинет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="screen">Загрузка…</div>

    <div id="screen-main" class="screen hidden">

      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22">
            <circle cx="9" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="15" cy="12" r="7" fill="var(--accent)" fill-opacity="0.9"/>
          </svg>
          <span>Мой VPN</span>
        </div>
        <div class="discount-chip hidden" id="discount-chip"></div>
      </header>

      <div class="hero-grid">
        <div class="hero-side">
          <div class="card mini-card">
            <div class="mini-label">Баланс</div>
            <div class="mini-value" id="balance">—</div>
            <button class="mini-btn" id="topup-shortcut">Пополнить</button>
          </div>
          <div class="card mini-card">
            <div class="mini-label">Скидка</div>
            <div class="mini-value" id="discount">—</div>
            <button class="mini-btn ghost" id="promo-shortcut">Промокод</button>
          </div>
        </div>

        <div class="card sub-card">
          <div class="ring-wrap">
            <svg class="ring-svg" id="ring-svg" viewBox="0 0 120 120"></svg>
            <div class="ring-center">
              <div class="ring-number" id="days-left">—</div>
              <div class="ring-label">дней</div>
            </div>
          </div>
          <div class="sub-plan-name" id="sub-plan-name">—</div>
          <div class="sub-plan-date" id="sub-plan-date">—</div>
          <button class="btn-manage" id="manage-btn">Управлять</button>
        </div>
      </div>

      <div class="card autorenew-card" id="autorenew-card">
        <span class="autorenew-dot" id="autorenew-dot"></span>
        <div class="autorenew-text">
          <div class="autorenew-title">Автопродление</div>
          <div class="autorenew-sub" id="autorenew-sub">—</div>
        </div>
        <button class="autorenew-toggle-btn hidden" id="autorenew-toggle-btn"></button>
      </div>

      <div id="sub-url-block" class="card hidden">
        <div class="card-title">Ссылка-подписка</div>
        <div class="sub-url" id="sub-url"></div>
        <button class="btn secondary" id="copy-sub-url">Скопировать</button>
      </div>

      <div class="section-title" id="plans-title">Тарифы</div>
      <div id="plans-list"></div>

      <div class="section-title">Пополнить баланс</div>
      <div id="topup-presets" class="chip-row"></div>
      <div class="row">
        <input id="topup-custom" type="number" min="10" placeholder="Своя сумма, ₽" />
        <button class="btn" id="topup-btn">Пополнить</button>
      </div>

      <div class="section-title" id="promo-title">Промокод</div>
      <div class="row">
        <input id="promo-input" type="text" placeholder="Введите код" />
        <button class="btn" id="promo-btn">Активировать</button>
      </div>

      <div class="section-title">Устройства</div>
      <div class="card" id="devices-text">—</div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
