<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Личный кабинет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="screen">Загрузка…</div>

    <div id="screen-main" class="screen hidden">
      <div class="card profile-card">
        <div class="profile-row"><span>Баланс</span><b id="balance">—</b></div>
        <div class="profile-row"><span>Скидка</span><b id="discount">—</b></div>
        <div class="profile-row"><span>Подписка до</span><b id="sub-expiry">—</b></div>
      </div>

      <div id="sub-url-block" class="card hidden">
        <div class="card-title">Ссылка-подписка</div>
        <div class="sub-url" id="sub-url"></div>
        <button class="btn secondary" id="copy-sub-url">Скопировать</button>
      </div>

      <div class="section-title">Тарифы</div>
      <div id="plans-list"></div>

      <div class="section-title">Пополнить баланс</div>
      <div id="topup-presets" class="chip-row"></div>
      <div class="row">
        <input id="topup-custom" type="number" min="10" placeholder="Своя сумма, ₽" />
        <button class="btn" id="topup-btn">Пополнить</button>
      </div>

      <div class="section-title">Промокод</div>
      <div class="row">
        <input id="promo-input" type="text" placeholder="Введите код" />
        <button class="btn" id="promo-btn">Активировать</button>
      </div>

      <div class="section-title">Устройства</div>
      <div class="card" id="devices-text">—</div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
